<!DOCTYPE html>
<html>

<head>

<title>Recruiter Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f2f5ff;
font-family:Arial;
}

.header{
background:#34495e;
color:white;
padding:20px;
text-align:center;
}

.chart-box{
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<div class="header">
<h2>Candidate Ranking Dashboard</h2>
</div>

<div class="container mt-5">

<div class="chart-box">

<canvas id="chart"></canvas>

</div>

</div>

<script>

async function loadChart(){

let response=await fetch("http://127.0.0.1:5000/candidates")

let data=await response.json()

let names=[]
let scores=[]

data.forEach(c=>{
names.push(c.name)
scores.push(c.score)
})

new Chart(document.getElementById("chart"),{

type:"bar",

data:{
labels:names,
datasets:[{
label:"Resume Score",
data:scores
}]
}

})

}

loadChart()

</script>

</body>

</html>
