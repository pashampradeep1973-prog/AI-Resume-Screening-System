<!DOCTYPE html>
<html>

<head>

<title>AI Resume Screening</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f2f5ff;
font-family:Arial;
}

.header{
background:linear-gradient(120deg,#2980b9,#6dd5fa);
color:white;
padding:20px;
text-align:center;
}

.upload-box{
border:2px dashed #aaa;
padding:40px;
text-align:center;
border-radius:10px;
background:white;
}

.card{
border:none;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<div class="header">
<h1>AI Resume Screening System</h1>
</div>

<div class="container mt-4">

<div class="card p-4">

<h4>Job Description</h4>

<textarea id="job" class="form-control" rows="4"></textarea>

<br>

<h4>Upload Resumes</h4>

<div class="upload-box">

<input type="file" id="resumes" multiple class="form-control">

<p class="mt-2">Upload multiple resumes</p>

</div>

<br>

<button class="btn btn-success" onclick="analyze()">Analyze Resumes</button>

</div>

<div class="card p-4 mt-4">

<h3>Candidate Ranking</h3>

<table class="table table-hover">

<thead class="table-dark">

<tr>
<th>Name</th>
<th>Score</th>
<th>Skills</th>
<th>Status</th>
</tr>

</thead>

<tbody id="results"></tbody>

</table>

<a href="dashboard.html" class="btn btn-primary">Open Dashboard</a>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
